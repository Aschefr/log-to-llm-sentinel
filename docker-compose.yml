# ==============================================================================
# LOG TO LLM SENTINEL - UNIVERSAL CONFIGURATION
# ==============================================================================

services:
  sentinel:
    # Build from current directory (uses Dockerfile)
    build: .
    container_name: log-to-llm-sentinel
    ports:
      - 10911:10911 # Web interface access
      - 10514:514/udp # Syslog receiver port
    volumes:
      # 1. MANDATORY: Application data (database, settings, history)
      # WARNING: DO NOT REMOVE THIS VOLUME!
      - ./data:/app/data
      # 2. Shared logs folder (used for binary log exports and temp files)
      - ./logs:/logs
      # 3. Optional: Access to Docker container logs
      - /var/lib/docker/:/docker-logs:ro
      # 4. Optional: Access to standard system logs (syslog, auth.log, etc.)
      - /var/log:/system-logs:ro
    environment:
      - PYTHONUNBUFFERED=1
      # IMPORTANT: List all container paths that the UI file browser should explore.
      - SENTINEL_BROWSE_ROOTS=/logs,/app/data,/docker-logs,/system-logs
      - SENTINEL_HOST_IP=${SENTINEL_HOST_IP:-}
    restart: unless-stopped

  # ==============================================================================
  # SYSTEM JOURNAL BRIDGE (OPTIONAL)
  # This service exports binary Linux Systemd logs into text for Sentinel.
  # No changes are required on your host system.
  # ==============================================================================
  system-journal-exporter:
    image: ubuntu:24.04
    container_name: log-to-llm-sentinel-journal-bridge
    # bash would be process 1 and ignore the stop signal: each update would wait 10 s, then Docker kills it
    init: true
    command: |
      bash -c "apt-get update && apt-get install -y systemd && 
               journalctl -f -n 100 > /logs/host_system_journal.log"
    volumes:
      # Necessary mount points to access the host's system journal
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd/journal:/run/systemd/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Writes the log stream to the shared folder with Sentinel
      - ./logs:/logs
    restart: unless-stopped

  # ==============================================================================
  # DOCKER DIAGNOSTICS (OPTIONAL, READ-ONLY)
  # Lets the AI of the chat / investigation check container state, health,
  # restarts and logs itself. Only read requests go through the proxy:
  # no start, stop, restart or exec. Sentinel never mounts the Docker socket.
  # In Sentinel: Configuration > Diagnostics > http://docker-proxy:2375
  # ==============================================================================
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sentinel-docker-proxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No "ports:" section: only Sentinel can reach it, through the compose network.
    restart: unless-stopped

  # ==============================================================================
  # WEB SEARCH (OPTIONAL)
  # Lets the AI of the chat and investigations search the web through a private
  # SearXNG. Queries go to public search engines; Sentinel refuses those holding an
  # address, a path or a machine name. Automatic alert analysis never uses it.
  # Start with: docker compose --profile web up -d
  # In Sentinel: Configuration > Diagnostics > http://searxng:8080
  # ==============================================================================
  searxng:
    image: searxng/searxng:2026.7.6-556d08c39
    container_name: sentinel-searxng
    profiles: ["web"]
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-log-to-llm-sentinel-private-instance}
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # No "ports:" section: only Sentinel can reach it, through the compose network.
    restart: unless-stopped

  # ==============================================================================
  # OPTIONAL: OLLAMA LOCAL AI SERVER
  # ==============================================================================
  # If you don't have an Ollama instance on another machine, you can
  # enable it here. Uncomment the lines below to activate.
  #
  # --- NOTE ON FLASH ATTENTION ---
  # Only for Nvidia GPUs. Massively accelerates attention computation.
  # Not recommended for CPUs (AMD/ARM).
  #
  # --- NOTE ON KV CACHE ---
  # type: q8_0 reduces RAM usage with minimal precision loss.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama-server
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_KV_CACHE_TYPE=q8_0
  #   #  - OLLAMA_FLASH_ATTENTION=1 
  #   restart: unless-stopped

# volumes:
#   ollama_data:

configs:
  searxng_settings:
    content: |
      use_default_settings: true
      server:
        limiter: false
        image_proxy: false
      search:
        formats:
          - html
          - json
