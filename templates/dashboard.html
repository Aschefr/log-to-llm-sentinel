{% extends "base.html" %}

{% block title %}Dashboard - Log to LLM Sentinel{% endblock %}

{% block content %}
<div class="dash">
    <header class="dash-verdict dash-verdict--checking" id="dash-verdict">
        <span class="dash-verdict-icon" id="dash-verdict-icon" aria-hidden="true"></span>
        <div class="dash-verdict-text">
            <h1 id="dash-verdict-title" aria-live="polite" data-i18n="dashboard.verdict_checking">Vérification…</h1>
            <p id="dash-verdict-sub"></p>
        </div>
        <span class="dash-verdict-time" id="dash-verdict-time"></span>
    </header>

    <section class="dash-section" aria-labelledby="dash-attention-title">
        <h2 class="dash-heading" id="dash-attention-title" data-i18n="dashboard.attention_title">À traiter</h2>
        <div id="dash-attention"></div>
        <div id="triage-last"></div>
    </section>

    <div class="dash-grid">
        <section class="dash-panel dash-trend" id="dash-trend" aria-labelledby="dash-trend-title">
            <h2 class="dash-panel-title" id="dash-trend-title" data-i18n="dashboard.trend_title">Alertes · 7 jours</h2>
            <div id="dash-trend-body" class="skel skel--chart"></div>
            <div class="dash-tip hidden" id="dash-tip" role="status"></div>
        </section>
        <section class="dash-panel dash-pilot" aria-labelledby="dash-pilot-title">
            <h2 class="dash-panel-title" id="dash-pilot-title" data-i18n="dashboard.pilot_title">Pilote automatique</h2>
            <div id="dash-pilot" class="skel skel--list"></div>
        </section>
        <section class="dash-panel dash-ollama-panel" aria-labelledby="dash-ollama-title">
            <h2 class="dash-panel-title" id="dash-ollama-title" data-i18n="dashboard.ollama_title">Ollama</h2>
            <div id="dash-ollama" class="skel skel--line"></div>
        </section>
    </div>

    <section class="dash-section" id="dash-history" aria-labelledby="dash-history-title">
        <div class="dash-history-head">
            <h2 class="dash-heading" id="dash-history-title" data-i18n="dashboard.history_title">Historique</h2>
            <div class="dash-history-tools">
                <div class="rp-seg" id="dash-filters" role="group" data-i18n-aria-label="dashboard.history_title"></div>
                <button type="button" class="btn btn-secondary btn-sm history-mark-all hidden" id="dash-mark-all" onclick="confirmMarkAllRead(this, DASH.watch?.counts, () => apiFetch('/api/monitor/view-all', { method: 'POST' }))" data-i18n="monitor.mark_all_read">Tout marquer comme lu</button>
            </div>
        </div>
        <div id="dash-history-list" class="analyses-list"></div>
        <div id="dash-history-state"></div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/source_connections.js?v=4"></script>
<script src="/static/js/dashboard.js?v=12"></script>
{% endblock %}
