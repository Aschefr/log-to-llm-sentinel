{% extends "base.html" %}

{% block title %}Règles - Log to LLM Sentinel{% endblock %}

{% block content %}
<div class="rules-overview">
    <div class="page-header ro-header">
        <div>
            <h1 data-i18n="rules.title">Règles</h1>
            <p class="ro-subtitle" id="ro-subtitle"></p>
        </div>
        <div class="ro-header-actions">
            <input type="search" id="ro-search" class="ro-search" data-i18n-placeholder="rules.search_placeholder" placeholder="Filtrer par nom ou source…" aria-label="Filtrer les règles">
            <a href="/rules/new" class="btn btn-primary" data-i18n="rules.new_rule">+ Nouvelle règle</a>
        </div>
    </div>

    <div class="ro-kpis skel skel--line" id="ro-kpis"></div>

    <div class="ro-card">
        <div class="ro-toolbar">
            <div class="rp-seg" id="ro-filters" role="group" aria-label="Filtre d'état"></div>
        </div>
        <div class="ro-scroll">
            <div class="ro-table" id="ro-table">
                <div class="loading" data-i18n="rules.loading">Chargement des règles...</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/source_connections.js?v=4"></script>
<script src="/static/js/rules.js?v=18"></script>
{% endblock %}
