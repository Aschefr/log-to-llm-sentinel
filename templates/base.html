<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Log to LLM Sentinel{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/style.css?v=44">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <nav class="navbar">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" onclick="toggleMobileNav()">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
        </button>
        <div class="nav-brand">
            <span class="nav-brand-title"><img src="/static/logo.png" alt="" class="nav-logo">Log to LLM Sentinel</span>
            <button type="button" class="nav-version" id="version-btn" data-version="{{ APP_VERSION }}" aria-haspopup="dialog">
                <span class="nav-version-number">v{{ APP_VERSION }}</span>
                <span class="nav-version-status" id="version-status"></span>
            </button>
        </div>
        <!-- Overlay INSIDE navbar so it shares stacking context with nav-links -->
        <div class="nav-overlay" id="nav-overlay" onclick="toggleMobileNav()"></div>
        <div class="nav-links" id="nav-links">
            <a href="/" data-i18n="nav.dashboard" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/rules" data-i18n="nav.rules" class="{% if request.url.path.startswith('/rules') %}active{% endif %}">Règles</a>
            <a href="/chat" data-i18n="nav.chat" class="{% if request.url.path.startswith('/chat') %}active{% endif %}">Log Chat</a>
            <a href="/meta-analysis" data-i18n="nav.meta" class="{% if request.url.path == '/meta-analysis' %}active{% endif %}">Méta-Analyse</a>
            <a href="/config" data-i18n="nav.config" class="{% if request.url.path == '/config' %}active{% endif %}">Configuration</a>
        </div>
        <div class="nav-right">
            <button type="button" class="nav-switch is-unknown" id="monitoring-switch" role="switch" aria-checked="mixed" disabled>
                <span class="nav-switch-track" aria-hidden="true"><span class="nav-switch-thumb"></span></span>
                <span class="nav-switch-label" data-i18n="header.monitoring_unknown">État inconnu</span>
            </button>
            <div class="nav-stats" id="nav-system-stats">
                <div class="stat-item" data-i18n-title="nav.tooltip_cpu" title="Utilisation CPU (App / Système)">
                    <span class="stat-label" data-i18n="nav.cpu_app">App</span>
                    <span id="stat-cpu-app" class="stat-value">--</span>
                    <span class="stat-label" data-i18n="nav.cpu_sys">Sys</span>
                    <span id="stat-cpu-sys" class="stat-value">--</span>
                </div>
                <div class="stat-item" data-i18n-title="nav.tooltip_ram" title="Utilisation RAM (App)">
                    <span class="stat-label" data-i18n="nav.ram">RAM</span>
                    <span id="stat-ram" class="stat-value">--</span>
                </div>
                <div class="stat-item stat-item--uptime" data-i18n-title="nav.tooltip_uptime" title="Uptime">
                    <span class="stat-label" data-i18n="nav.uptime">Uptime</span>
                    <span id="stat-uptime" class="stat-value">--</span>
                </div>
                <div class="stat-item stat-item--time" data-i18n-title="nav.tooltip_time" title="Heure du serveur">
                    <span id="server-time-display" class="stat-value">--:--:--</span>
                </div>
            </div>
            <button type="button" id="theme-toggle-btn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="header.theme_light" title="Passer au thème clair"></button>
            <div id="lang-switcher"></div>
        </div>
    </nav>
    <dialog class="changelog" id="changelog-dialog" aria-labelledby="changelog-title">
        <div class="changelog-inner">
            <header class="changelog-head">
                <div>
                    <h2 id="changelog-title" data-i18n="header.changelog_title">Nouveautés</h2>
                    <p class="form-hint"><span data-i18n="header.changelog_current">Version installée :</span> {{ APP_VERSION }}</p>
                </div>
                <button type="button" class="theme-btn" id="changelog-close" data-i18n-title="common.close" data-i18n-aria-label="common.close" title="Fermer" aria-label="Fermer">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
                </button>
            </header>
            <div class="changelog-actions">
                <button type="button" class="btn btn-secondary btn-sm" id="changelog-check" data-i18n="header.changelog_check">Vérifier les mises à jour</button>
                <span class="form-hint cfg-result" id="changelog-check-result" role="status"></span>
            </div>
            <div id="changelog-update"></div>
            <p class="form-hint changelog-note" data-i18n="header.changelog_note">Le journal des versions est rédigé en anglais.</p>
            <div class="changelog-list" id="changelog-list"></div>
        </div>
    </dialog>
    <main class="{% block container_class %}container{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <!-- KaTeX : rendu des formules mathématiques LaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <script src="/static/js/i18n.js?v=2"></script>
    <script src="/static/js/common.js?v=20"></script>
    <script src="/static/js/header.js?v=1"></script>
    <script src="/static/js/event_notes.js?v=2"></script>
    <script src="/static/js/triage.js?v=2"></script>
    <script>
    /* ── Mobile hamburger nav toggle ── */
    function toggleMobileNav() {
        document.getElementById('nav-links').classList.toggle('open');
        document.getElementById('nav-overlay').classList.toggle('open');
    }
    /* Close nav on link click */
    document.querySelectorAll?.call(document, '.nav-links a')?.forEach(a => {
        a.addEventListener('click', () => {
            document.getElementById('nav-links')?.classList.remove('open');
            document.getElementById('nav-overlay')?.classList.remove('open');
        });
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.getElementById('nav-links')?.classList.remove('open');
            document.getElementById('nav-overlay')?.classList.remove('open');
        }
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
