<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Connexion — Log to LLM Sentinel</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/style.css?v=92">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="login-body">
    <main class="login-page">
        <div class="rp-card login-card">
            <div class="login-brand">
                <img src="/static/logo.png" alt="" class="nav-logo">
                <span>Log to LLM Sentinel</span>
                <div id="lang-switcher"></div>
            </div>
            <h1 data-i18n="auth.login_title">Connexion</h1>

            <div id="login-passkey" class="login-block hidden">
                <button type="button" class="btn btn-primary" id="login-passkey-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4M18 5l2 2M15 8l2 2"/></svg>
                    <span data-i18n="auth.login_passkey">Se connecter avec une clé d'accès</span>
                </button>
                <p class="form-hint hidden" id="login-passkey-unavailable"></p>
            </div>

            <form id="login-password" class="login-block hidden" novalidate>
                <label for="login-password-input" data-i18n="auth.password_label">Mot de passe</label>
                <input type="password" id="login-password-input" autocomplete="current-password" required>
                <button type="submit" class="btn btn-secondary" id="login-password-btn" data-i18n="auth.login_password">Se connecter</button>
            </form>

            <p class="form-hint cfg-result" id="login-result" role="status" aria-live="polite"></p>
            <p class="form-hint login-reset" data-i18n-html="auth.login_reset_hint">Plus aucun moyen de te connecter ? Crée un fichier vide <code>data/reset-auth</code> puis redémarre Sentinel : la connexion est désactivée et ses clés effacées.</p>
        </div>
    </main>
    <script>window.SENTINEL_NEXT = {{ next | tojson }};</script>
    <script src="/static/js/i18n.js?v=3"></script>
    <script src="/static/js/passkey.js?v=1"></script>
    <script src="/static/js/login.js?v=2"></script>
</body>
</html>
