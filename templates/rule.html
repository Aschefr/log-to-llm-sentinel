{% extends "base.html" %}

{% block title %}Règle — Log to LLM Sentinel{% endblock %}

{% block content %}
<div class="rule-page" id="rule-page" data-rule-id="{{ rule_id or '' }}">
    <a href="/rules" class="rp-back" data-i18n="rule.back">← Toutes les règles</a>

    <div class="rp-header">
        <div class="rp-title-block">
            <div class="rp-title-row">
                <h1 id="rp-name"></h1>
                <span id="rp-status" class="rp-pill hidden"></span>
                <span id="rp-autopilot" class="rp-pill rp-pill--ap hidden"></span>
            </div>
            <div id="rp-subtitle" class="rp-subtitle mono"></div>
        </div>
        <div class="rp-header-actions hidden" id="rp-header-actions">
            <label class="toggle-switch">
                <input type="checkbox" id="rp-enabled">
                <span class="toggle-slider"></span>
                <span class="toggle-label" data-i18n="rule.enabled">Activée</span>
            </label>
            <button type="button" id="rp-test-btn" class="btn btn-secondary btn-sm" data-i18n="rule.test">Tester</button>
            <button type="button" id="rp-download-btn" class="btn btn-secondary btn-sm" data-i18n="rule.download_log">Télécharger le log</button>
            <button type="button" id="rp-delete-btn" class="btn btn-danger btn-sm" data-i18n="common.delete">Supprimer</button>
        </div>
    </div>

    <nav class="rp-tabs hidden" id="rp-tabs" role="tablist" aria-label="Sections de la règle">
        <a href="#overview" data-tab="overview" role="tab" data-i18n="rule.tab_overview">Vue d'ensemble</a>
        <a href="#log" data-tab="log" role="tab" data-i18n="rule.tab_log">Journal en direct</a>
        <a href="#analyses" data-tab="analyses" role="tab"><span data-i18n="rule.tab_analyses">Analyses</span> <span id="rp-unread-badge" class="rp-count hidden"></span></a>
        <a href="#resolution" data-tab="resolution" role="tab" data-i18n="rule.tab_resolution">Résolution</a>
        <a href="#keywords" data-tab="keywords" role="tab"><span data-i18n="rule.tab_keywords">Mots-clés</span> <span id="rp-kw-badge" class="rp-count hidden"></span></a>
        <a href="#settings" data-tab="settings" role="tab" data-i18n="rule.tab_settings">Réglages</a>
    </nav>

    <section id="tab-overview" class="rp-panel hidden" role="tabpanel"></section>
    <section id="tab-log" class="rp-panel hidden" role="tabpanel"></section>
    <section id="tab-analyses" class="rp-panel hidden" role="tabpanel">
        <div class="rp-toolbar">
            <div class="rp-seg" id="an-filters" role="group" aria-label="Filtre"></div>
            <div class="rp-toolbar-right">
                <label class="rp-inline-label"><span data-i18n="rule.period">Période</span>
                    <select id="an-period">
                        <option value="7" data-i18n="rule.days_7">7 jours</option>
                        <option value="30" data-i18n="rule.days_30">30 jours</option>
                        <option value="" data-i18n="rule.all_time">Tout</option>
                    </select>
                </label>
                <label class="rp-inline-label"><input type="checkbox" id="an-open-only"> <span data-i18n="rule.open_only">Incidents ouverts seulement</span></label>
                <button type="button" class="btn btn-secondary btn-sm" id="an-mark-read" data-i18n="monitor.mark_all_read">Tout marquer comme lu</button>
            </div>
        </div>
        <div id="an-list" class="rp-analyses"></div>
    </section>
    <section id="tab-resolution" class="rp-panel hidden" role="tabpanel"></section>
    <section id="tab-keywords" class="rp-panel hidden" role="tabpanel"></section>
    <section id="tab-settings" class="rp-panel hidden" role="tabpanel">
        {% include '_rule_form.html' %}
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/rule_form.js?v=7"></script>
<script src="/static/js/rule_page.js?v=10"></script>
<script src="/static/js/rule_keywords.js?v=4"></script>
{% endblock %}
